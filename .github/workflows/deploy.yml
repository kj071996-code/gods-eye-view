name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build -- --base=/gods-eye-view/
      - name: Fix Cesium path for subpath hosting
        run: |
          if [ -d dist/gods-eye-view/cesium ]; then
            mkdir -p dist/cesium
            cp -r dist/gods-eye-view/cesium/. dist/cesium/
            rm -rf dist/gods-eye-view
          fi
      - name: Verify Cesium assets are in place
        run: test -f dist/cesium/Cesium.js && test -f dist/cesium/Widgets/widgets.css
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
